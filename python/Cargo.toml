[package]
name = "terrana-py"
version = "0.3.3"
edition = "2021"
# pyo3 and pythonize 0.29 need 1.83; the engine crate alone still builds on 1.82.
rust-version = "1.83"
publish = false
description = "Python bindings for Terrana — spatial queries and geodesic geometry"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jmcmeen/terrana"

# Builds directly into the Python module `terrana`. It can take that name because
# the engine crate it wraps is imported under the alias `terrana_core` below — a
# crate and a same-named `#[pymodule] fn` can't coexist in one file.
[lib]
name = "terrana"
crate-type = ["cdylib"]

[dependencies]
# Imported as `terrana_core` (not `terrana`) so it doesn't collide with the
# `#[pymodule] fn terrana` in src/lib.rs — a local item named `terrana` shadows a
# dependency crate of the same name, which breaks `terrana::...` path resolution.
terrana_core = { package = "terrana", path = "..", features = ["server"] }
# abi3-py39: build a single stable-ABI wheel that runs on CPython 3.9 .. 3.14+.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
# Version-matched to pyo3; converts serde_json::Value query rows into Python objects.
pythonize = "0.29"
tokio = { version = "1", features = ["full"] }
# Same bundled DuckDB as the engine (features unify), so we can name `Connection`.
# 1.20000 (DuckDB 2.0): `geometry_always_xy`, which radius/nearest distances depend on.
duckdb = { version = "1.20000", features = ["bundled"] }
geo-types = "0.7"
geojson = { version = "1", features = ["geo-types"] }
serde_json = "1"
