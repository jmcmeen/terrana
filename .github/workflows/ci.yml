name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GitHub evicts a cache after 7 days unused. Two runs a week on main keep its
  # caches (which PR runs restore) warm, so a PR doesn't recompile DuckDB from
  # scratch. Release only follows push runs, so these never release.
  schedule:
    - cron: "17 7 * * 1,4"
  # Run by hand on any branch: stacked PRs above the bottom one don't target main,
  # so they get CI only this way (gh workflow run ci.yml --ref <branch>).
  workflow_dispatch: {}

concurrency:
  # A new push to a PR cancels its older run. Every other run gets its own group,
  # so each push to main finishes CI and can be released.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # Clippy runs every check `cargo check` would, over all targets.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rust-cache empties these but keeps the directories, which breaks a build-script rerun (#72).
      - name: Drop DuckDB sources from the restored cache
        shell: bash
        run: rm -rf target/duckdb-sources target/*/duckdb-sources python/target/duckdb-sources python/target/*/duckdb-sources
      - run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rust-cache empties these but keeps the directories, which breaks a build-script rerun (#72).
      - name: Drop DuckDB sources from the restored cache
        shell: bash
        run: rm -rf target/duckdb-sources target/*/duckdb-sources python/target/duckdb-sources python/target/*/duckdb-sources
      # The integration tests start the server, which needs DuckDB's spatial
      # extension. Caching it keeps the tests off the network after the first run.
      # Keyed on the duckdb crate version alone, so other dependency bumps reuse it;
      # saved from main only, like rust-cache.
      - id: duckdb
        run: echo "version=$(grep -A1 '^name = "duckdb"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ steps.duckdb.outputs.version }}
      - run: cargo test --all
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ steps.duckdb.outputs.version }}

  # Build and test each binary publish.yml releases, the way it builds it, so a
  # release never ships a build CI hasn't run. The Linux binaries are built in the
  # manylinux 2_28 images (glibc 2.28) so they run on RHEL 8+, Debian 10+ and
  # Amazon Linux 2023, not only on hosts as new as the runner.
  build-linux:
    name: Build and test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            image: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            image: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rust-cache empties these but keeps the directories, which breaks a build-script rerun (#72).
      - name: Drop DuckDB sources from the restored cache
        shell: bash
        run: rm -rf target/duckdb-sources target/*/duckdb-sources python/target/duckdb-sources python/target/*/duckdb-sources
      - id: duckdb
        shell: bash
        run: echo "version=$(grep -A1 '^name = "duckdb"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ steps.duckdb.outputs.version }}
      # The release profile, so the binary built is the one tested.
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ steps.duckdb.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: terrana-${{ matrix.target }}
          path: target/release/terrana

  build:
    name: Build and test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            test: true
            macos: "11.0"
          # Cross-compiled on the arm64 runner, as publish.yml does; built, not run.
          # DuckDB 2.0 needs macOS 10.13 (aligned deallocation).
          - os: macos-latest
            target: x86_64-apple-darwin
            test: false
            macos: "10.13"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            test: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rust-cache empties these but keeps the directories, which breaks a build-script rerun (#72).
      - name: Drop DuckDB sources from the restored cache
        shell: bash
        run: rm -rf target/duckdb-sources target/*/duckdb-sources python/target/duckdb-sources python/target/*/duckdb-sources
      - id: duckdb
        if: matrix.test
        shell: bash
        run: echo "version=$(grep -A1 '^name = "duckdb"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: matrix.test
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ steps.duckdb.outputs.version }}
      - if: matrix.test
        run: cargo test --release --target ${{ matrix.target }}
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos }}
      - run: cargo build --release --target ${{ matrix.target }}
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos }}
      - uses: actions/cache/save@v4
        if: matrix.test && github.ref == 'refs/heads/main'
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ steps.duckdb.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: terrana-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/terrana${{ runner.os == 'Windows' && '.exe' || '' }}

  # The macOS x86_64 wheel is cross-compiled with its own deployment target, so build
  # it as python-publish.yml does: a release mustn't be the first to try.
  wheel-macos-x86_64:
    name: Wheel (macOS x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: python
          key: wheel-macos-x86_64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rust-cache empties these but keeps the directories, which breaks a build-script rerun (#72).
      - name: Drop DuckDB sources from the restored cache
        shell: bash
        run: rm -rf target/duckdb-sources target/*/duckdb-sources python/target/duckdb-sources python/target/*/duckdb-sources
      - uses: PyO3/maturin-action@v1
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.13"
        with:
          command: build
          args: --release --out dist
          target: x86_64
          working-directory: python

  python:
    name: Python bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64 and arm64 Linux, both of which get a manylinux wheel on PyPI.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    # The cold run compiles bundled DuckDB for the python crate (~15–20 min); the
    # cache below makes subsequent runs fast. 40 min is a safe backstop, not a target.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Cache python/target so DuckDB is compiled once, not on every run.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: python
          key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rust-cache empties these but keeps the directories, which breaks a build-script rerun (#72).
      - name: Drop DuckDB sources from the restored cache
        shell: bash
        run: rm -rf target/duckdb-sources target/*/duckdb-sources python/target/duckdb-sources python/target/*/duckdb-sources
      - uses: astral-sh/setup-uv@v5
      # The server tests need DuckDB's spatial extension; cached as in the test job.
      - id: duckdb
        run: echo "version=$(grep -A1 '^name = "duckdb"$' python/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ steps.duckdb.outputs.version }}
      # Single shell so the activated venv persists across build + test.
      - name: Build extension and run tests
        working-directory: python
        run: |
          uv venv --python 3.13
          source .venv/bin/activate
          uv pip install maturin pytest pytest-timeout
          maturin develop
          # --timeout caps any single test so a stuck server test can't hang the job.
          pytest tests/ -v --timeout=120
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ steps.duckdb.outputs.version }}
