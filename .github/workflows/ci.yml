name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GitHub evicts a cache after 7 days unused. Two runs a week on main keep its
  # caches (which PR runs restore) warm, so a PR doesn't recompile DuckDB from
  # scratch. Release only follows push runs, so these never release.
  schedule:
    - cron: "17 7 * * 1,4"

concurrency:
  # A new push to a PR cancels its older run. Every other run gets its own group,
  # so each push to main finishes CI and can be released.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # Clippy runs every check `cargo check` would, over all targets.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The integration tests start the server, which needs DuckDB's spatial
      # extension. Caching it keeps the tests off the network after the first run.
      # Keyed on the duckdb crate version alone, so other dependency bumps reuse it;
      # saved from main only, like rust-cache.
      - id: duckdb
        run: echo "version=$(grep -A1 '^name = "duckdb"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ steps.duckdb.outputs.version }}
      - run: cargo test --all
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ steps.duckdb.outputs.version }}

  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every platform publish.yml releases a binary for (the x86_64 macOS one is
        # cross-compiled on macos-latest), so a release never ships an untested build.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: duckdb
        shell: bash
        run: echo "version=$(grep -A1 '^name = "duckdb"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ steps.duckdb.outputs.version }}
      - run: cargo build --release
      # The release profile, so the binary just built is the one tested. Linux x86_64
      # is already tested by the test job.
      - if: matrix.os != 'ubuntu-latest'
        run: cargo test --release
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ steps.duckdb.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: terrana-${{ matrix.os }}
          path: target/release/terrana${{ runner.os == 'Windows' && '.exe' || '' }}

  python:
    name: Python bindings
    runs-on: ubuntu-latest
    # The cold run compiles bundled DuckDB for the python crate (~15–20 min); the
    # cache below makes subsequent runs fast. 40 min is a safe backstop, not a target.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Cache python/target so DuckDB is compiled once, not on every run.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: python
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@v5
      # The server tests need DuckDB's spatial extension; cached as in the test job.
      - id: duckdb
        run: echo "version=$(grep -A1 '^name = "duckdb"$' python/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ steps.duckdb.outputs.version }}
      # Single shell so the activated venv persists across build + test.
      - name: Build extension and run tests
        working-directory: python
        run: |
          uv venv --python 3.13
          source .venv/bin/activate
          uv pip install maturin pytest pytest-timeout
          maturin develop
          # --timeout caps any single test so a stuck server test can't hang the job.
          pytest tests/ -v --timeout=120
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ steps.duckdb.outputs.version }}
