name: Publish

# Builds the release binaries, attaches them to the GitHub release, publishes
# the crate to crates.io, and starts python-publish.yml for the PyPI wheels.
#
# release.yml creates the vX.Y.Z tag and GitHub release when a merge to main is released
# and dispatches this workflow on that tag (a tag pushed by GITHUB_TOKEN doesn't
# trigger tag-push workflows). Pushing a vX.Y.Z tag by hand also runs it. Safe
# to re-run: binaries are re-uploaded and a version already on crates.io is
# skipped.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

# One publish per tag at a time: a retry or a hand-pushed tag waits for the run
# already publishing that version instead of racing it.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Require a release tag on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          # Run by hand on a branch, this would create a branch-named release.
          if [ "$GITHUB_REF_TYPE" != tag ] || ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Publish only runs on a vX.Y.Z tag, not $GITHUB_REF_TYPE '$GITHUB_REF_NAME'."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main; only release tags from main are published."
            exit 1
          fi

  # Linux binaries are built in the manylinux 2_28 images (glibc 2.28), as the
  # wheels are, so they run on RHEL 8+, Debian 10+ and Amazon Linux 2023 rather than
  # only on hosts as new as the runner. ci.yml builds and tests them the same way.
  build-linux:
    name: Build ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
          # Native arm64 runner: no cross-compiling the bundled DuckDB C++.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        # A tag's cache can't be read by any other run; only main saves.
        with:
          key: ${{ matrix.target }}
          save-if: false
      # rust-cache empties these but keeps the directories, which breaks a build-script rerun (#72).
      - name: Drop DuckDB sources from the restored cache
        shell: bash
        run: rm -rf target/duckdb-sources target/*/duckdb-sources python/target/duckdb-sources python/target/*/duckdb-sources
      - run: cargo build --release
      - name: Package
        run: tar czf terrana-${{ matrix.target }}.tar.gz -C target/release terrana
      - uses: actions/upload-artifact@v4
        with:
          name: terrana-${{ matrix.target }}
          path: terrana-${{ matrix.target }}.tar.gz

  build:
    name: Build ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing shouldn't cancel the others' binaries.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: terrana
            macos: "11.0"
          # DuckDB 2.0 needs macOS 10.13 (aligned deallocation); set it rather than
          # rely on a default.
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: terrana
            macos: "10.13"
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: terrana.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        # A tag's cache can't be read by any other run; only main saves.
        with:
          save-if: false
      # rust-cache empties these but keeps the directories, which breaks a build-script rerun (#72).
      - name: Drop DuckDB sources from the restored cache
        shell: bash
        run: rm -rf target/duckdb-sources target/*/duckdb-sources python/target/duckdb-sources python/target/*/duckdb-sources
      - run: cargo build --release --target ${{ matrix.target }}
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos }}
      - name: Package
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../terrana-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}
      # Windows users expect a .zip.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.artifact }} -DestinationPath terrana-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: terrana-${{ matrix.target }}
          path: terrana-${{ matrix.target }}.*

  release:
    name: Attach binaries to the release
    needs: [guard, build-linux, build]
    # Attach whatever built, even if one platform failed; that failure still shows
    # as a failed job on the run.
    if: ${{ !cancelled() && needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload binaries
        run: |
          # release.yml has normally created it; a hand-pushed tag hasn't.
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          shopt -s nullglob
          files=(artifacts/*.tar.gz artifacts/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No binaries were built."; exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

  publish-crate:
    name: Publish to crates.io
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        # A tag's cache can't be read by any other run; only main saves.
        with:
          save-if: false
      # rust-cache empties these but keeps the directories, which breaks a build-script rerun (#72).
      - name: Drop DuckDB sources from the restored cache
        shell: bash
        run: rm -rf target/duckdb-sources target/*/duckdb-sources python/target/duckdb-sources python/target/*/duckdb-sources
      # crates.io publishes the version in Cargo.toml, not the tag — so guard that
      # they agree before publishing (versions are immutable and can't be re-pushed).
      - name: Verify Cargo.toml version matches the tag
        run: |
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          TAG="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml=$CARGO_VERSION  tag=$TAG"
          test "$CARGO_VERSION" = "$TAG" || {
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match tag $GITHUB_REF_NAME"; exit 1;
          }
      - name: Publish
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          published() {
            curl -sf -A "terrana-release (github.com/jmcmeen/terrana)" \
              "https://crates.io/api/v1/crates/terrana/$VERSION" > /dev/null
          }
          if published; then
            echo "terrana $VERSION is already on crates.io; skipping."
          elif ! cargo publish; then
            # Another run may have published it first (crates.io takes only one).
            sleep 20
            published || exit 1
            echo "terrana $VERSION was published by another run."
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  python:
    name: Start the PyPI publish
    needs: guard
    # A hand-pushed tag already triggers python-publish.yml itself.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh workflow run python-publish.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
